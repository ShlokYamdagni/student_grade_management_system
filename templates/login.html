<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Grade Management System</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e3f5fe 0%, #d0e6f9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .container {
    width: 1500px;
    max-width: 90%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: white;
    border-radius: 20px;
    box-shadow: 0 14px 50px rgba(0, 0, 0, 0.07);
  }
  .left-panel {
    background: linear-gradient(135deg, #25a1f0, #1b78d6);
    border-top-left-radius: 20px;
    border-bottom-left-radius: 20px;
    padding: 60px 40px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .left-panel h1 {
    font-size: 2.8rem;
    font-weight: 900;
    margin: 0 0 40px;
    line-height: 1.1;
  }
  .icon-row {
    font-size: 5rem;
    opacity: 0.5;
    user-select: none;
    letter-spacing: 1.4rem;
    margin-bottom: 60px;
  }
  .right-panel {
    padding: 60px 50px;
    border-top-right-radius: 20px;
    border-bottom-right-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .right-panel h2 {
    color: #0a5c38;
    font-weight: 900;
    font-size: 2rem;
    margin-bottom: 40px;
    letter-spacing: 1.1px;
  }
  form {
    display: flex;
    flex-direction: column;
  }
  input[type="text"],
  input[type="password"] {
    padding: 16px 18px;
    border: 2px solid #b8d8f9;
    border-radius: 18px;
    font-size: 1rem;
    margin-bottom: 28px;
    transition: border-color 0.3s ease;
  }
  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #0c5db3;
    outline: none;
    background-color: #f1f9ff;
  }
  button[type="submit"] {
    padding: 18px 0;
    background: linear-gradient(135deg, #0c5db3, #1d7ee3);
    border: none;
    border-radius: 18px;
    font-size: 1.2rem;
    font-weight: 900;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 25px rgba(12, 93, 179, 0.6);
    transition: background-color 0.3s ease;
  }
  button[type="submit"]:hover {
    background: linear-gradient(135deg, #1451a2, #317ed4);
  }
  .message {
    margin-top: 20px;
    font-weight: 600;
    color: #c0392b;
    user-select: none;
    text-align: center;
  }
  a {
    color:#0c5db3;
    font-weight:900;
    text-decoration:none;
  }
  a:hover { text-decoration:underline; }

  @media (max-width: 720px) {
    .container {
      grid-template-columns: 1fr;
    }
    .left-panel, .right-panel {
      border-radius: 20px 20px 0 0;
      padding: 40px 30px;
      text-align: center;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h1>STUDENT<br>GRADE<br>MANAGEMENT<br>SYSTEM</h1>
      <div class="icon-row">* / - + * / - + * / - + *</div>
    </div>

    <div class="right-panel">
      <h2>LOGIN</h2>
      <form method="POST">
        <input type="text" name="username" placeholder="Username (teacher) or Roll Number (student)" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">LOGIN</button>
      </form>

      <p style="margin-top:18px;text-align:center;">
        <a href="/register">Don't have an account? Register</a>
      </p>

      <div class="message">{{ msg }}</div>
    </div>
  </div>
</body>
</html>
